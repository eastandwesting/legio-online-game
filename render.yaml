services:
  - type: web
    name: legio-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Number of proxies in front of the app. Render sets RENDER and the server then defaults to 1 anyway;
      # it is spelled out here so that it is easy to change. After the first visit read the "proxy check"
      # line in the logs: each player must show up as their own address (README, Deploy).
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Websocket handshakes from a browser must come from the game's own address. The server compares the
      # Origin header with the Host it receives; naming the public address here keeps that working even if
      # the platform rewrites Host. Add a custom domain here too (comma-separated) if you attach one.
      - key: ALLOWED_ORIGINS
        value: "https://legio-online.onrender.com"
